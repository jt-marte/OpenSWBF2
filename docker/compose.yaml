# OpenSWBF2 dedicated server. In a folder with this file:
#   docker compose up -d
#   docker compose exec openswbf2 steam-login    # once: scan the QR code with the Steam app
#   docker compose logs -f                       # the game downloads (about 13 GB, once), then starts
services:
  openswbf2:
    image: ghcr.io/jt-marte/openswbf2-server:latest
    container_name: openswbf2
    restart: unless-stopped
    ports:
      - "3658:3658/udp"          # the game and admin; keep in step with PORT below
      - "3658:3658/tcp"          # mod downloads; keep in step with MOD_PORT (PORT unless set)
    environment:
      PORT: "3658"
      SERVER_NAME: "OpenSWBF2 Server"
      ADMIN_PASSWORD: ""         # 6-31 letters/digits; empty = generated into config/admin-password
      JOIN_PASSWORD: ""          # empty = anyone can join; admins can change it live with /password
      MAPS: "geo1c_con kas2g_con nab2c_con hot1g_con tat2g_con cor1c_con myg1g_con uta1c_con"
      MAX_PLAYERS: "32"
      TICK_RATE: "60"            # 30, 60 or 120
      BOTS_PER_TEAM: "16"
      DIFFICULTY: "3"            # 2 Medium, 3 Hard, 4 Overhaul
      HEROES: "1"
      AI_HEROES: "1"
      LOBBY: "0"                 # 1 = each map waits for Start; launcher players wait in its lobby
      MOD_SHARING: "1"           # players' launchers download the server's mods from it
      MOD_RATE: "50"             # download cap in Mbit/s for everyone together; 0 = none
      MOD_UPLOADS: "1"           # admins can upload mods from the launcher (admin password)
    volumes:
      - ./config:/config         # settings, logs, the game from Steam (about 14 GB), built core files, admin password, uploaded mods
      - ./addons:/addons:ro      # optional: mod folders such as BF1 and DLC_XBOX
      # - ./gamedata:/gamedata:ro  # optional: your own copy of the game (a folder holding data/_lvl_pc) instead of Steam
    # It starts as root only to give /config to the server's user (uid 1000), then runs as that
    # user with no capabilities; these four are only for that first step
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
